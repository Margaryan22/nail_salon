version: '3.8'
services:
  app:
    build: .
    network_mode: "host"  # ✅ Host network
    environment:
      - SPRING_PROFILES_ACTIVE=default

  postgres:
    image: postgres:13
    network_mode: "host"  # ✅ Host network
    environment:
      POSTGRES_DB: nails_ver_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root