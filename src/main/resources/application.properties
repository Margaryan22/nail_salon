# ====================
# SERVER CONFIGURATION
# ====================

server.port=3000
server.address=0.0.0.0

# ====================
# DATABASE CONFIGURATION (HOST MODE)
# ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/nails_ver_2
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ====================
# JPA / HIBERNATE
# ====================

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ??????? PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ???????????
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# ====================
# JWT CONFIGURATION
# ====================

# 24 ????
jwt.expiration-time=86400000
# 7 ????
jwt.refresh-expiration-time=604800000

# ????????? ????
jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ====================
# CORS CONFIGURATION
# ====================

app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# ====================
# LOGGING
# ====================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.Frolov_back.NAILS_WEB_APP=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# ====================
# ADDITIONAL SETTINGS
# ====================

# ????????? Liquibase
spring.liquibase.enabled=false

# MVC
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Jackson (JSON)
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=com.fasterxml.jackson.databind.util.StdDateFormat
spring.jackson.time-zone=Europe/Moscow

# Actuator (??? health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always